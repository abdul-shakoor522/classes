<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login from</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        body, html{
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f2f4f7;
        }
        .main{
            display: flex;
            width: 100%;
            height: 100%;
        }
        .left{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 50%;
        }
        .left img{
            margin-left: -210px;
            /* background-color: red; */
            /* height: 200px; */
            
            width: 270px;
        }

        .left h2{
            font-weight: 500;
        }

        .right{
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main form{
            padding: 20px;
            width: 350px;
            border-radius: 10px;
            background-color: white;
            display: flex;
            gap: 20px;
            flex-direction: column;
        }
        form input{
            padding: 16px 12px;
            border-radius: 5px;
            border: 1px solid gray;
        }
        
        form button{
            border-radius: 5px;
            padding: 16px 12px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            background-color: #0866ff;
            color: white;
        }
        form a{
            text-align: center;
        }
        form .new-account{
            width: fit-content;
            align-self: center;
            background-color: #42b72a;
        }
        @media screen and (max-width: 408px) {
  .main{
    flex-direction: column;
    flex-wrap: wrap;
  }
  .left img{
    margin-left: -100px;
    margin-top: 30px;
}
.left{
    width: 100%;
    padding-bottom: 20px;
}
.left h2{
      margin-left: -100px;
      margin-top: -10px;
      width: 100%;
    font-size: 12px;
    text-align: center;
  }
  .right{
      width: 100%;
      align-items: center;
      justify-content: center;
    }
    .right form{
        margin-left: -100px;
    width: 230px;
    padding: 16px;
  }

  form input{
            padding: 10px 7px;
        }
        
        form button{
            padding: 10px 7px;

        }
}


    </style>
</head>
<body>
    <div class="main">
        <div class="left">
            <div class="logo">
                <img src="imgs/logo.svg"    >
            </div>
            <h2>Facebook helps you connect and share <br> with the people in your life.</h2>
        </div>
        <div class="right">
                <!-- form -->
                <form>
                    <input type="text" placeholder="email address or phone number">
                    <input type="password" placeholder="Password">
                    <button>Log in</button>
                    <a href="#">Forgotten Password?</a>
                    <button class="new-account">Create new account</button>
                </form>
        </div>
    </div>
</body>
</html>
